<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin login | FixOAU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body data-auth-role="admin">

  <div class="auth">
    <aside class="auth-aside">
      <a class="auth-brand" href="../index.html">
        <img src="../images/logo.svg" alt="" width="26" height="31">
        <span>FixOAU</span>
      </a>
      <div class="auth-pitch">
        <p class="auth-role">Staff console</p>
        <h2>Review, assign and resolve campus maintenance requests.</h2>
      </div>
      <p class="auth-note">Authorised administrators only.</p>
    </aside>

    <main class="auth-main">
    <form class="auth-card" id="loginForm" method="post" novalidate>
      <h1>Admin Login</h1>
      <p class="auth-sub">Enter your credentials to continue.</p>

      <div class="field">
        <label for="adminId">Admin ID</label>
        <input type="text" id="adminId" name="adminId" placeholder="Your admin ID" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw-field">
          <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" data-target="password" aria-label="Show password">Show</button>
        </div>
      </div>

      <p id="errorMsg" class="error-msg" role="alert" aria-live="polite"></p>

      <button type="submit" class="btn-auth">Login</button>

      <p class="auth-alt">Don't have an account? <a href="adminregister.html">Sign Up</a></p>
      <p class="auth-home"><a href="../index.html">Back to home</a></p>
    </form>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/core.js"></script>
  <script src="../js/demo.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
