<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Register</title>
    <link rel="stylesheet" href="/css/adminregister.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
   <div class="container">

        <div class="info">

            <img src="images/logo.svg" alt="Fix OAU" width="26" height="31">

            <h2>Admin Portal</h2>

        </div>

        <div class="login-card">

            <form id="registerForm" novalidate>

                <h1>Admin Sign Up</h1>

                <p>Enter your Credentials to continue</p>

                <p id="errorMsg" class="message" role="alert"></p>

                <div class="input-box">
                    <input type="text" id="adminId" name="adminId" placeholder="Admin Id" autocomplete="username" required>
                    <span class="material-icons">person</span>
                </div>

                <div class="input-box">
                    <input type="email" id="email" name="email" placeholder="Email Address" autocomplete="email" required>
                    <span class="material-icons">email</span>
                </div>

                <div class="input-box">
                    <input type="password" id="password" name="password" placeholder="Create Password" class="password" autocomplete="new-password" required>
                    <span class="material-icons visible" id="togglePassword">visibility</span>
                </div>

                <div class="input-box">
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" class="password" autocomplete="new-password" required>
                    <span class="material-icons visible" id="toggleConfirmPassword">visibility</span>
                </div>

                <button type="submit" id="registerBtn" class="register">Register</button>

                <div class="login">
                    <span>Have an account? <a href="adminlogin.html">Login</a></span>
                </div>

                <div class="home">
                    <a href="index.html">⬅ Back to Home</a>
                </div>

            </form>

        </div>

    </div>


    <script src="/js/adminregister.js"></script>
</body>
</html>
