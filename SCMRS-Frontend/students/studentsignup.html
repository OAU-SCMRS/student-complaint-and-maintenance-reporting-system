<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sign Up page</title>
    <link rel="stylesheet" href="css/studentsignup.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body data-auth-role="student">
   <div class="container">

        <div class="info">

            <img src="../images/logo.svg" alt="Fix OAU" width="26" height="31">

            <h2>Student Portal</h2>

        </div>

        <div class="signup-card">

            <form id="signupForm" method="post" novalidate>

                <h1>Sign Up</h1>

                <p>Enter your Credentials to continue</p>

                <div class="input-box">
                    <input type="text" id="fullName" name="fullName" placeholder="Full Name" autocomplete="name" required>
                    <span class="material-icons" aria-hidden="true">badge</span>
                </div>

                <div class="input-box">
                    <input type="text" id="studentId" name="studentId" placeholder="Student Id" autocomplete="username" required>
                    <span class="material-icons" aria-hidden="true">person</span>
                </div>

                <div class="input-box">
                    <input type="email" id="email" name="email" placeholder="Email Address" autocomplete="email" required>
                    <span class="material-icons" aria-hidden="true">email</span>
                </div>

                <div class="input-box">
                    <input type="password" id="password" name="password" placeholder="Create Password" autocomplete="new-password" required>
                    <button type="button" class="material-icons pw-eye" data-target="password" aria-label="Show password">visibility</button>
                </div>

                <div class="input-box">
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" required>
                    <button type="button" class="material-icons pw-eye" data-target="confirmPassword" aria-label="Show password">visibility</button>
                </div>

                <p id="errorMsg" class="error-msg" role="alert" aria-live="polite"></p>

                <button type="submit" class="register"> Register</button>
                
                <div class="login">
                    <span>Have an account? <a href="studentlogin.html">Login</a></span>
                </div>

                <div class="home">
                    <a href="../index.html">⬅ Back to Home</a>
                </div>

            </form>

        </div>

    </div>

    <script src="../js/config.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/demo.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
