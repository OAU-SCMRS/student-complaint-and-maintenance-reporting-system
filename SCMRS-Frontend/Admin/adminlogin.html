<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login Page</title>
    <link rel="stylesheet" href="css/adminlogin.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>
<body data-auth-role="admin">

    <div class="container">

        <div class="info">

            <img src="../images/logo.svg" alt="Fix OAU" width="26" height="31">

            <h2>Admin Portal</h2>

        </div>

        <div class="login-card">

            <form id="loginForm" method="post" novalidate>

                <h1>Admin Login</h1>

                <p>Enter your Credentials to continue</p>
                <div class="input-box">
                    <input type="text" id="adminId" name="adminId" placeholder="Admin Id" autocomplete="username" required>
                    <span class="material-icons" aria-hidden="true">person</span>
                </div>

                <div class="input-box">
                    <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
                    <button type="button" class="material-icons pw-eye" data-target="password" aria-label="Show password">visibility</button>
                </div>

                <p id="errorMsg" class="error-msg" role="alert" aria-live="polite"></p>

                <button type="submit" class="login"> Login </button>
                
                <div class="signup">
                    <span>Don't have an account? <a href="adminregister.html">Sign Up</a></span>
                </div>

                <div class="home">
                    <a href="../index.html">⬅ Back to Home</a>
                </div>

            </form>

        </div>

    </div>
    <script src="../js/config.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/demo.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
