<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports &amp; Analytics | FixOAU Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-dashboard.css">
</head>
<body data-role="admin">

  <input type="checkbox" id="nav-check" class="nav-check" aria-label="Toggle navigation menu">
  <label class="sidebar-overlay" for="nav-check"></label>

  <aside class="sidebar">
    <a class="side-brand" href="../index.html">
      <img src="../images/logo.svg" alt="" width="26" height="31">
      <span>FixOAU</span>
    </a>
    <label class="side-close" for="nav-check"><span class="sr-only">Close menu</span></label>
    <nav class="side-nav">
      <a href="admin.html">Overview</a>
      <a href="manage-complaints.html">Manage Complaints</a>
      <a href="adminreports.html" class="active">Reports &amp; Analytics</a>
      <a href="admin-notifications.html">Notifications</a>
      <a href="admin-profile.html">Settings</a>
    </nav>
    <a class="logout" href="../index.html">Log Out</a>
  </aside>

  <div class="main">
    <header class="topbar">
      <label class="menu-btn" for="nav-check"><span class="bars" aria-hidden="true"></span><span class="sr-only">Open menu</span></label>
      <div class="greet">
        <h1>Reports &amp; Analytics</h1>
        <p>See how complaints are being handled across campus.</p>
      </div>
      <div class="top-right">
        <a class="bell" href="admin-notifications.html" aria-label="Notifications">
          <svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1 1 12 0v6l1.5 2h-15zM10 21h4"/></svg>
        </a>
        <span class="avatar" id="avatar"></span>
      </div>
    </header>

    <main class="content">
      <section class="stats">
        <div class="stat">
          <span class="stat-icon i-total"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg></span>
          <div><p>Total Complaints</p><strong data-metric="total"></strong></div>
        </div>
        <div class="stat">
          <span class="stat-icon i-resolved"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg></span>
          <div><p>Resolution Rate</p><strong data-metric="rate"></strong></div>
        </div>
        <div class="stat">
          <span class="stat-icon i-pending"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
          <div><p>Avg. Resolution Time</p><strong data-metric="time"></strong></div>
        </div>
        <div class="stat">
          <span class="stat-icon i-progress"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3-6 7-6s7 2.4 7 6"/></svg></span>
          <div><p>Unassigned</p><strong data-metric="unassigned"></strong></div>
        </div>
      </section>

      <div class="reports-grid">
        <section class="panel">
          <h2>Complaints by Status</h2>
          <div class="bar-list" id="by-status"></div>
        </section>

        <section class="panel">
          <h2>Complaints by Category</h2>
          <div class="bar-list" id="by-category"></div>
        </section>

        <section class="panel wide">
          <h2>Complaints per Week</h2>
          <div class="weekly" id="weekly"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/core.js"></script>
  <script src="../js/demo.js"></script>
  <script src="../js/reports.js"></script>

</body>
</html>
