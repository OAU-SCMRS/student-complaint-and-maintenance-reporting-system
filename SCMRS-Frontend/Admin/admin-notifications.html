<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | FixOAU Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-dashboard.css">
</head>
<body data-role="admin">

  <input type="checkbox" id="nav-check" class="nav-check" aria-label="Toggle navigation menu">
  <label class="sidebar-overlay" for="nav-check"></label>

  <aside class="sidebar">
    <a class="side-brand" href="../index.html">
      <img src="../images/logo.svg" alt="" width="26" height="31">
      <span>FixOAU</span>
    </a>
    <label class="side-close" for="nav-check"><span class="sr-only">Close menu</span></label>
    <nav class="side-nav">
      <a href="admin.html">Overview</a>
      <a href="manage-complaints.html">Manage Complaints</a>
      <a href="adminreports.html">Reports &amp; Analytics</a>
      <a href="admin-notifications.html" class="active">Notifications</a>
      <a href="admin-profile.html">Settings</a>
    </nav>
    <a class="logout" href="../index.html">Log Out</a>
  </aside>

  <div class="main">
    <header class="topbar">
      <label class="menu-btn" for="nav-check"><span class="bars" aria-hidden="true"></span><span class="sr-only">Open menu</span></label>
      <div class="greet">
        <h1>Notifications</h1>
        <p>New complaints and anything that needs your attention.</p>
      </div>
      <div class="top-right">
        <a class="bell" href="admin-notifications.html" aria-label="Notifications">
          <svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1 1 12 0v6l1.5 2h-15zM10 21h4"/></svg>
        </a>
        <span class="avatar" id="avatar"></span>
      </div>
    </header>

    <main class="content">
      <div class="page-actions">
        <div class="tabs" role="tablist">
          <button class="tab active" role="tab" data-tab="All">All</button>
          <button class="tab" role="tab" data-tab="Unread">Unread</button>
        </div>
        <button class="mark-all" id="mark-all">Mark all as read</button>
      </div>

      <div class="notif-list" id="list"></div>
      <p class="empty" id="empty" hidden>You are all caught up.</p>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/core.js"></script>
  <script src="../js/demo.js"></script>
  <script src="../js/notifications.js"></script>

</body>
</html>
