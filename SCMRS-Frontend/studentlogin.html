<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login Page</title>
    <link rel="stylesheet" href="/css/studentlogin.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<body>

    <div class="container">

        <div class="info">

            <img src="images/logo.svg" alt="Fix OAU" width="26" height="31">

            <h2>Student Portal</h2>

        </div>

        <div class="login-card">

            <form id="loginForm" action="">

                <h1>Login</h1>

                <p>Enter your Credentials to continue</p>
                <div class="input-box">
                    <input type="text" id="studentId" name="studentId" placeholder="Student Id" required>
                    <span class="material-icons">person</span>
                </div>

                <div class="input-box">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <span class="material-icons" id="visible">visibility</span>
                </div>

                <p id="errorMsg" class="error-msg" role="alert"></p>

                <button type="submit" class="login"> Login </button>
                
                <div class="signup">
                    <span>Don't have an account? <a href="studentsignup.html">Sign Up</a></span>
                </div>

                <div class="home">
                    <a href="index.html">⬅ Back to Home</a>
                </div>

            </form>

        </div>

    </div>
    <script src="/js/studentlogin.js"></script>
</body>
</html>
